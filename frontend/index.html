<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<script>
  // Apply the stored theme before first paint so there is no flash of the wrong mode.
  try { var t = localStorage.getItem("tether.theme"); if (t === "colour" || t === "dark") { document.documentElement.setAttribute("data-theme", t); } } catch (e) { /* default: dark */ }
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tether — the handover that holds</title>
<meta name="description" content="Tether rebuilds one project's state from authorised sources — every line checked against its source, a human decides, and a named person signs.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23F5F6F8'/%3E%3Cpath d='M10 22c4-8 8-8 12 0' stroke='%230D0F13' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3Cpath d='M10 10c4 8 8 8 12 0' stroke='%230D0F13' stroke-opacity='.5' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="/" data-nav="/" aria-label="Tether home">
      <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#F5F6F8"/><path d="M9.5 22c4.6-8.6 8.4-8.6 13 0" stroke="#0D0F13" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M9.5 10c4.6 8.6 8.4 8.6 13 0" stroke="#0D0F13" stroke-opacity=".45" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
      <span class="brand-word">Tether<span class="brand-tag">NightOwls · Round 2</span></span>
    </a>

    <nav class="topnav" id="topnav" aria-label="Sections">
      <a href="#" data-nav="" data-view="connect">Connect</a>
      <a href="#" data-nav="" data-view="rebuild">Reconstruct</a>
      <a href="#" data-nav="" data-view="review">Review Queue</a>
      <a href="#" data-nav="" data-view="signoff">Sign-Off</a>
      <a href="#" data-nav="" data-view="handover">Successor View</a>
      <a href="#" data-nav="" data-view="admin">Admin &amp; Log</a>
    </nav>

    <div class="topbar-right">
      <button class="theme-btn" id="theme-toggle" type="button" aria-pressed="true" title="Switch between Dark and Colour theme">
        <span class="theme-btn-dot" aria-hidden="true"></span>
        <span class="theme-btn-text"><b id="theme-name">Dark</b></span>
      </button>
      <label class="role-wrap" title="Demo mode — switching role re-reads everything server-side">ROLE:
        <select id="role-select" class="role-select" aria-label="Switch role"></select>
      </label>
      <a class="judge-link" href="/judge" data-nav="/judge">Judge Guide</a>
    </div>
  </header>

  <div class="stepper-wrap">
    <ol class="stepper" id="stepper" aria-label="Workflow gates"></ol>
  </div>

  <main class="page" id="app" tabindex="-1"></main>
</div>

<div class="modal-backdrop" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-label="Citation">
    <div class="modal-head">
      <div>
        <div class="modal-kicker">CITATION PROOF · CHECK CK-1</div>
        <div class="modal-locator" id="cite-locator">—</div>
        <div class="cite-status" id="cite-status" hidden></div>
        <div class="modal-meta" id="cite-meta">—</div>
      </div>
      <button class="icon-btn" id="cite-close" aria-label="Close">✕</button>
    </div>
    <div class="modal-body">
      <div class="cite-redactions" id="cite-redactions" hidden></div>
      <pre class="cite-text" id="cite-text"></pre>
    </div>
  </div>
</div>

<div class="toast-rack" id="toasts" aria-live="polite"></div>
<script src="/app.js" defer></script>
</body>
</html>

name: ci
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: python3 -m playwright install --with-deps chromium
      - run: python3 scripts/verify.py
        env:
          REQUIRE_E2E: "1"

  postgres-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tether_admin
          POSTGRES_PASSWORD: tether-admin-ci
          POSTGRES_DB: tether
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tether_admin -d tether"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.txt
      - name: Create the non-bypass application role
        run: PGPASSWORD=tether-admin-ci psql -h 127.0.0.1 -U tether_admin -d tether -v app_password=ci-app-password -f db/init/001_create_app_role.sql
      - name: Exercise row security against PostgreSQL
        run: python3 -m pytest backend/tests/test_perm1_leak_successor.py backend/tests/test_perm5_rls_forced.py -q
        env:
          TETHER_DATABASE_URL: postgresql://tether_app:ci-app-password@127.0.0.1:5432/tether
